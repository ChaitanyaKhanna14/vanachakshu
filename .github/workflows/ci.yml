name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Allows running the suite by hand from the Actions tab.
  workflow_dispatch:

# A new push to the same branch cancels the previous run rather than queueing
# behind it. Keeps feedback fast and stays inside the free-tier minutes budget.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Fail fast and print full tracebacks rather than truncating them.
  PYTHONUNBUFFERED: "1"
  FORCE_COLOR: "1"

jobs:
  quality:
    name: Lint, types, tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      # One failing version should not hide the result of the others.
      fail-fast: false
      matrix:
        # 3.11 is the local development version; 3.12 guards against relying on
        # anything that a newer interpreter changes.
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check --output-format=github .

      - name: Check formatting (ruff)
        run: ruff format --check --diff .

      - name: Type check (mypy, strict)
        run: mypy

      # The important line in this file.
      #
      # Earth Engine needs Google credentials. CI does not have them, and should
      # not: storing them here would leak quota to every fork and burn the 1,000
      # EECU-hour monthly allowance on routine pushes. Tests that genuinely need
      # Earth Engine are marked `@pytest.mark.ee` and are excluded here; they are
      # run locally against real credentials before release.
      #
      # This constraint is a feature. It forces detection thresholds, area maths,
      # date windows and alert deduplication to live in credential-free modules,
      # which is exactly where the bugs that matter would otherwise hide.
      - name: Run tests (excluding Earth Engine integration)
        run: pytest -m "not ee" --cov=vanachakshu --cov-report=term-missing

  # Guards the failure mode where the EE-marked tests silently stop existing,
  # or someone forgets the marker and CI starts trying to reach Google.
  marker-hygiene:
    name: Earth Engine markers are respected
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Collection must succeed with no unknown markers
        # --strict-markers (set in pyproject) turns a typo'd marker into an
        # error instead of a silently-ignored decorator.
        run: pytest --collect-only -q
