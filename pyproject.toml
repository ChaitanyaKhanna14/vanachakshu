[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vanachakshu"
version = "0.1.0"
description = "Near-real-time forest disturbance alerts for the Western Ghats, India"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "earthengine-api>=1.4",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "shapely>=2.0",
    "typer>=0.12",
    "rich>=13.7",
    # Used directly to download validation image chips. Arrives transitively via
    # earthengine-api, but depending on it explicitly is the honest declaration.
    "requests>=2.31",
]

[project.optional-dependencies]
# Kept separate from core: these pull in GDAL-adjacent wheels that are slow to
# install and are not needed for the scheduled alert job, only for local analysis.
analysis = [
    "geopandas>=1.0",
    "rasterio>=1.3",
    "numpy>=1.26",
    "pandas>=2.2",
]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
vanachakshu = "vanachakshu.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/vanachakshu"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
# Deliberately NOT pinning python_version. mypy then targets whichever
# interpreter it runs under, which is what the CI matrix needs.
#
# Pinning it to 3.11 broke the 3.12 job: mypy parsed as 3.11 while reading
# dependency stubs installed for 3.12, and numpy's stubs use `type` statements
# that only 3.12+ can parse. The failure names numpy, so it reads like a
# dependency problem rather than a configuration one.
strict = true
files = ["src/vanachakshu"]
# earthengine-api ships inline type hints as of 1.7, so no override is needed
# and Earth Engine calls are genuinely type-checked. If you ever pin an older
# release, add back an ee.* override with ignore_missing_imports.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "ee: test requires authenticated Earth Engine access (deselect with -m 'not ee')",
]
